<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- brand/ and vendor/ are copied in by scripts/sync-assets.mjs (npm run sync) -->
    <link rel="stylesheet" href="brand/tokens.css" />
    <link rel="stylesheet" href="vendor/inter/index.css" />
    <link rel="stylesheet" href="vendor/playfair-display/wght-italic.css" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, var(--paper) 55%, var(--beige) 130%);
        font-family: var(--font-sans);
        color: var(--ink);
      }
      .scene-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        gap: 56px;
      }
      /* Wordmark is 216x64; the quill occupies its first 64 units. */
      .lockup {
        position: relative;
        width: 960px;
        height: 284.44px;
      }
      .lockup img {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
      }
      /* Text half of the wordmark: its own quill is always masked out (the standalone
         mark sits on top), and --type sweeps a soft edge left to right. */
      #wordmark {
        --type: 34.5;
        width: 100%;
        mask-image: linear-gradient(
          90deg,
          transparent 34.5%,
          #000 34.5%,
          #000 calc(var(--type) * 1% - 9%),
          transparent calc(var(--type) * 1%)
        );
      }
      /* The quill inks in from nib to tip along its 42deg axis. */
      #mark {
        --ink: 0;
        width: 29.63%;
        mask-image: linear-gradient(
          45deg,
          #000 calc(var(--ink) * 1% - 22%),
          transparent calc(var(--ink) * 1%)
        );
      }
      #rule {
        width: 120px;
        height: 1px;
        background: var(--sand);
        margin-top: -16px;
      }
      #tagline {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 60px;
        letter-spacing: 0.005em;
        color: var(--stone);
        margin-top: -24px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="logo-sting"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="sting" class="scene-content">
        <div id="lockup" class="lockup">
          <img id="wordmark" src="brand/logo/wordmark-light.svg" alt="Journal" />
          <img id="mark" src="brand/logo/mark-light.svg" alt="" />
        </div>
        <div id="rule"></div>
        <p id="tagline">Private by design.</p>
      </div>
    </div>
    <script>
      // Shift that centres the quill alone: (216/2 - 32) / 216 of the lockup width.
      const MARK_CENTRE_X = 960 * (76 / 216);

      const tl = gsap.timeline({ paused: true });

      // 0.3–1.7s: quill inks in and settles.
      tl.set('#lockup', { x: MARK_CENTRE_X }, 0);
      tl.set('#mark', { '--ink': 0, y: 14, rotation: -4, scale: 0.97, transformOrigin: '30% 80%' }, 0);
      tl.to('#mark', { '--ink': 122, duration: 1.3, ease: 'sine.inOut' }, 0.3);
      tl.to('#mark', { y: 0, rotation: 0, scale: 1, duration: 1.5, ease: 'power2.out' }, 0.3);

      // 1.75–3.0s: lockup glides to centre while "Journal" writes on.
      tl.to('#lockup', { x: 0, duration: 1.15, ease: 'power3.inOut' }, 1.75);
      tl.fromTo('#wordmark', { '--type': 34.5 }, { '--type': 110, duration: 1.1, ease: 'power2.out' }, 1.95);

      // 2.85–3.8s: hairline, then the tagline.
      tl.fromTo('#rule', { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.7, ease: 'power2.out' }, 2.85);
      tl.fromTo('#tagline', { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.9, ease: 'power2.out' }, 3.0);

      // 3.9–5.0s: hold.
      window.__timelines = window.__timelines || {};
      window.__timelines['logo-sting'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
