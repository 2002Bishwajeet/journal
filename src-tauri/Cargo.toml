[package]
name = "journal"
version = "2.70.0"
description = "Journal"
edition = "2021"
rust-version = "1.77.2"

# Mobile targets have no `main` — iOS/Android load the app as a library and call
# the `#[tauri::mobile_entry_point]` symbol in lib.rs. staticlib is for iOS,
# cdylib for Android, rlib so the desktop `main.rs` binary can link it.
[lib]
name = "journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Links native/'s Swift (build.rs, iOS with native/ only). Already in the tree through tauri-plugin.
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
# Derives for the command types of the premium Rust in native/rust (a dependency of tauri already).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tiny_http = "0.12"
# HTTPS to the billing Worker for the premium license key (native/rust/license.rs): the Worker
# sends no CORS headers, so the web view can't call it. The same reqwest and rustls (ring) the
# updater already brings in, so Cargo.lock gains no crates.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Native error dialog when the asset server can't bind (lib.rs). Same library
# and GTK backend tauri-plugin-dialog uses, without that plugin's tauri bump and
# its bundled fs plugin. Desktop only: rfd has no iOS/Android backend.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
# Auto-update from the GitHub release's latest.json (update_loop in lib.rs).
tauri-plugin-updater = "2"
# Launch at login and a single running instance, used by the tray code in native/.
tauri-plugin-autostart = "2"
# OS notifications for share invites and collaborator edits, registered by native/.
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The quick-capture hotkey, used by the capture code in native/.
tauri-plugin-global-shortcut = "2"
# External links and the macOS sign-in open in the default browser (src/lib/native.ts).
tauri-plugin-opener = "2"

# External links and the sign-in open in an in-app browser (plugins/browser, #1188).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-browser = { path = "plugins/browser" }

# Objective-C runtime calls for hide_form_accessory_bar() and
# allow_swipe_navigation() in lib.rs. Already in the tree through wry; listed so
# lib.rs can name it.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"

# macOS notification actions and the daily reminder, used by native/ (#1123): UserNotifications
# called directly for the actions, per-note threads, calendar triggers and the click delegate.
# NSUserActivity for Handoff and Spotlight taps (#1147). Already in the tree through wry and tauri.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSCalendar", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSURL", "NSUserActivity"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# The completion handler of WKWebView's takeSnapshot (ios_recovery.rs). Already
# in the tree through wry.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"

# The premium Rust tests (native/rust) call the commands through the mock runtime, with the
# app's real permissions.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# Enabled by the Tauri CLI for production builds. Turning it on flips
# `tauri::is_dev()` to false and embeds `frontendDist` into the binary.
# DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
