[package]
name = "journal"
version = "2.73.30"
description = "Journal"
edition = "2021"
rust-version = "1.77.2"

# Mobile targets have no `main` — iOS/Android load the app as a library and call
# the `#[tauri::mobile_entry_point]` symbol in lib.rs. staticlib is for iOS,
# cdylib for Android, rlib so the desktop `main.rs` binary can link it.
[lib]
name = "journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Links native/'s Swift (build.rs, iOS with native/ only). Already in the tree through tauri-plugin.
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
# Derives for the command types of the premium Rust in native/rust (a dependency of tauri already).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tiny_http = "0.12"
# HTTPS to the billing Worker for the premium license key (native/rust/license.rs): the Worker
# sends no CORS headers, so the web view can't call it. The same reqwest and rustls (ring) the
# updater already brings in. Android adds webpki-roots for its TLS roots (below).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Release dates for the updater's license check (should_install in lib.rs, native/rust/license.rs,
# #1316): the updater's own date type, already in the tree through it. Not desktop-only:
# license.rs compiles on every platform.
time = { version = "0.3", features = ["parsing"] }
# The database key (db_key.rs, #1361, #1364), made from the OS's random source on every platform
# and kept through keyring-core: keyring's entry type on the desktop, and the iOS and Android
# stores below on the phone. Both are in the tree already, through keyring.
getrandom = "0.4"
keyring-core = "1"
# External links and the macOS sign-in open in the default browser (src/lib/native.ts); on iOS and
# Android it opens the store listing's itms-apps:// and market:// links (#1439).
tauri-plugin-opener = "2"
# Settings → Data → Export: a Save dialog on desktop, the share sheet on iOS and Android
# (plugins/export, #1205).
tauri-plugin-export = { path = "plugins/export" }

# Native error dialog when the asset server can't bind (lib.rs). Same library
# and GTK backend tauri-plugin-dialog uses, without that plugin's tauri bump and
# its bundled fs plugin. Desktop only: rfd has no iOS/Android backend.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
# Auto-update from the GitHub release's latest.json (update_loop in lib.rs).
tauri-plugin-updater = "2"
# Launch at login and a single running instance, used by the tray code in native/.
tauri-plugin-autostart = "2"
# OS notifications for share invites and collaborator edits, registered by native/.
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The quick-capture hotkey, used by the capture code in native/.
tauri-plugin-global-shortcut = "2"
# The database key (db_key.rs, #1361): kept in the macOS Keychain, Windows Credential Manager or
# Linux Secret Service.
keyring = "4"

# External links and the sign-in open in an in-app browser (plugins/browser, #1188).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-browser = { path = "plugins/browser" }
# The app lock's Face ID / Touch ID and BiometricPrompt (app_lock.rs, #1364), called from Rust.
tauri-plugin-biometric = "2"

# A SharedPreferences file encrypted with an Android Keystore key. Tauri already sets up the
# ndk-context it reads.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
# The license client's TLS roots on Android (native/rust/license.rs, #1200): reqwest's
# rustls-platform-verifier panics there until it's initialised with the JVM.
webpki-roots = "1"

# Objective-C runtime calls for hide_form_accessory_bar() and
# allow_swipe_navigation() in lib.rs. Already in the tree through wry; listed so
# lib.rs can name it.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"

# macOS notification actions and the daily reminder, used by native/ (#1123): UserNotifications
# called directly for the actions, per-note threads, calendar triggers and the click delegate.
# NSUserActivity for Handoff and Spotlight taps (#1147). Already in the tree through wry and tauri.
# block2 is also takeSnapshot's completion handler, and CGRect the bounds of the cover a reload
# shows (webview_recovery.rs, #1368).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSCalendar", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSURL", "NSUserActivity"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
# The app lock's Touch ID, or the account password (app_lock.rs, #1363).
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

# The app lock's Windows Hello (app_lock.rs, #1363). Already in the tree through tauri and wry.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

# The completion handler of WKWebView's takeSnapshot (webview_recovery.rs).
# Already in the tree through wry.
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
# The database key (db_key.rs, #1364) in the data protection keychain, which has the
# "this device only, after first unlock" access policy.
apple-native-keyring-store = { version = "1", features = ["protected"] }

# WebKitGTK's web-process-terminated signal (webview_recovery.rs, #1368). Already in the tree
# through wry, which turns on a later version than v2_20.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_20"] }

# The premium Rust tests (native/rust) call the commands through the mock runtime, with the
# app's real permissions.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Builds the Android license client's TLS config in the desktop tests (native/rust/license.rs).
webpki-roots = "1"

[features]
# Enabled by the Tauri CLI for production builds. Turning it on flips
# `tauri::is_dev()` to false and embeds `frontendDist` into the binary.
# DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
