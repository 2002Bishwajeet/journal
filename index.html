  <body>
    <!-- Inline script to prevent flash of wrong theme -->
    <script>
      (function() {
        const THEME_KEY = 'journal-theme-preference';
        const stored = localStorage.getItem(THEME_KEY);
        let theme = 'system';
        if (stored === 'light' || stored === 'dark' || stored === 'system') {
          theme = stored;
        }
        const actualTheme = theme === 'system' 
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme;
        document.documentElement.classList.add(actualTheme);
        document.documentElement.style.colorScheme = actualTheme;
        // Same as syncThemeColor (src/lib/themeColor.ts): the status bar follows the in-app theme (#893)
        const color = getComputedStyle(document.documentElement).getPropertyValue('--background').trim();
        if (color) document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', color));
      })();
    </script>
    <!-- Static first frame: the splash logo where the launch images and SplashScreen.tsx put it
         (128 px, centre 56 px above the screen centre). React replaces it on mount. -->
    <div id="root"><div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center"><img src="/src/assets/logo_withoutbg.png" alt="" style="width: 128px; height: 128px; object-fit: contain; transform: translateY(-56px)" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
