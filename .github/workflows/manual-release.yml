name: Manual Release

# Bumps, tags (pushed with the RELEASE_DEPLOY_KEY deploy key) and releases, then deploys that tag to production.
# Releases made with github.token don't fire `release: published`, so the deploys
# are called here instead.
#
# Releases are immutable once published: no asset can be added after that. With
# DESKTOP_RELEASES on, the release is made as a draft, desktop-release.yml attaches
# the installers and latest.json to it, then publishes it. If a desktop build fails,
# the release stays a draft: re-run the failed jobs, or run Desktop Release by hand
# with the tag and publish on. With DESKTOP_RELEASES off, the release is published at once.
#
# With STORE_BUILDS on, the iOS and Android builds of the tag are submitted too: App
# Review, and the Play release track (ios-release.yml, android-release.yml, #1304).
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Pushes the release commit and tag over SSH: the deploy key is the
          # main ruleset's bypass actor; github.token can't bypass it on a personal repo.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # npm version only rewrites package.json and package-lock.json, so no install
      # (and no GitHub Packages token) is needed.
      - name: Bump version
        run: |
          VERSION_TYPE=${{ github.event.inputs.version_type }}
          npm version $VERSION_TYPE --no-git-tag-version
          node scripts/native-version.mjs

      - name: Generate Changelog
        run: |
          npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      # Hand-written user notes (ASD-STE100): gathers release-notes/*.md and
      # RELEASE_NOTES.md's "## Unreleased"; fails the release when both are empty.
      - name: Stamp release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$VERSION" "$(date -u +%F)" > "$RUNNER_TEMP/release-notes.md"

      - name: Commit and Tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add -A package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md RELEASE_NOTES.md release-notes
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A draft doesn't create its tag, so --verify-tag makes sure the pushed one is used.
      - name: Create GitHub Release
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          gh release create v$VERSION --verify-tag ${{ vars.DESKTOP_RELEASES == 'true' && '--draft' || '' }} --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy-cloudflare:
    needs: release
    permissions:
      contents: read
      packages: read
      deployments: write
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Desktop installers and the updater manifest for this release (#305); it then
  # publishes the draft release. Off until
  # the signing secrets are set: `gh variable set DESKTOP_RELEASES --body true`.
  desktop-release:
    needs: release
    if: vars.DESKTOP_RELEASES == 'true'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit

  # The App Store and Google Play builds of this release (#1304). Each one checks
  # STORE_BUILDS itself, because a push to main also starts it.
  ios-release:
    needs: release
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ios-release.yml
    with:
      mode: submit
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit

  android-release:
    needs: release
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/android-release.yml
    with:
      mode: submit
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
