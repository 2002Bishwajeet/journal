name: Manual Release

# Bumps, tags and releases with github.token, then deploys that tag to production.
# Releases made with github.token don't fire `release: published`, so the deploys
# are called here instead.
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # npm version only rewrites package.json and package-lock.json, so no install
      # (and no GitHub Packages token) is needed.
      - name: Bump version
        run: |
          VERSION_TYPE=${{ github.event.inputs.version_type }}
          npm version $VERSION_TYPE --no-git-tag-version

      - name: Generate Changelog
        run: |
          npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

      - name: Commit and Tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          gh release create v$VERSION --title "v$VERSION" --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy-cloudflare:
    needs: release
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  deploy-netlify:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-netlify.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
