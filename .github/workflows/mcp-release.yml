name: Release MCP package

# Bumps journal-mcp (mcp/package/package.json), builds and smoke-tests it, publishes it to npm as
# `journal-mcp` through trusted publishing (OIDC: no token, provenance is automatic), then commits,
# tags and pushes the bump (with the RELEASE_DEPLOY_KEY deploy key, like manual-release.yml) and
# attaches the package to an `mcp-v<version>` GitHub release. The Claude Code plugin
# (plugins/journal/.mcp.json) and the site's setup guide run `npx -y journal-mcp@latest`, so they
# need no bump; the plugin's own version changes only when the plugin does.
# Releases made with GITHUB_TOKEN don't trigger the `release: published` deploy workflows.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version bump'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: the registry swaps the job's OIDC token for a one-time publish token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pushes the bump commit and tag over SSH: the deploy key is the main ruleset's bypass actor.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bump version
        id: version
        run: |
          (cd mcp/package && npm version ${{ github.event.inputs.version_type }} --no-git-tag-version)
          echo "version=$(node -p "require('./mcp/package/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the clients run journal-mcp@latest
        run: |
          # A pinned release URL would leave installed clients behind (#1035).
          grep -q "journal-mcp@latest" plugins/journal/.mcp.json \
            || { echo "plugins/journal/.mcp.json doesn't run journal-mcp@latest"; exit 1; }
          ! grep -rn "releases/download/mcp-v" plugins/journal site/agents.html \
            || { echo "plugins/journal or site/agents.html still pins a journal-mcp release"; exit 1; }

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        run: npm run mcp:pack

      - name: Smoke test the packed server
        run: npx -y --package=file:$PWD/mcp/journal-mcp-${{ steps.version.outputs.version }}.tgz journal-mcp --help

      # Before the push: if this fails, nothing is tagged and the workflow can simply be re-run.
      - name: Publish to npm
        run: |
          # The .npmrc above only serves @homebase-id from GitHub Packages; drop it so nothing redirects or authenticates the publish.
          rm .npmrc
          # Trusted publishing needs npm 11.5.1 or newer.
          npm i -g npm@latest
          npm publish "mcp/journal-mcp-${{ steps.version.outputs.version }}.tgz" --access public --registry https://registry.npmjs.org

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp/package/package.json
          git commit -m "chore(mcp): $VERSION [skip ci]"
          git tag "mcp-v$VERSION"
          git push origin HEAD:main "mcp-v$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "mcp-v$VERSION" "mcp/journal-mcp-$VERSION.tgz" \
            --title "Journal MCP $VERSION" --notes "Journal MCP server $VERSION for the Claude Code plugin." \
            --verify-tag --latest=false
