name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic suite split three ways; `e2e` below is the required check.
  # Step caps are about 1.5x the measured p90 (#868); they sum to 40 min, plus
  # 2 min for the uncapped steps that take a second each.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    permissions:
      contents: read
      packages: read
    env:
      # Agent-harness PRs keep their screenshots for the e2e-evidence job below (#1324). The
      # branch name too: `gh pr create --label` adds the label after the PR's opened event.
      HARNESS_PR: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'agent/') || contains(github.event.pull_request.labels.*.name, 'agent-harness')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@v7

      - name: Use Node.js 22
        timeout-minutes: 1
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install dependencies
        timeout-minutes: 2
        run: npm ci --include=optional

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        timeout-minutes: 1
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: npx playwright install chromium

      # apt on the runner fetched ~26 MB of fonts and libs at ~30 kB/s, or hung in
      # `apt-get update` on an unreachable mirror, for up to 13.5 min (#868). So keep
      # the .debs and, once cached, install them offline with dpkg.
      - name: Cache Playwright OS packages
        timeout-minutes: 1
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: playwright-apt-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-offline
          restore-keys: playwright-apt-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-

      - name: Install Playwright OS dependencies
        timeout-minutes: 3
        run: .github/scripts/playwright-deps.sh chromium

      - name: Run E2E (hermetic)
        timeout-minutes: 16
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      # On shard 3, the shortest hermetic shard.
      - name: Run mobile E2E (chromium)
        if: matrix.shard == 3
        # Hit 8 minutes on PRs #955 and #956 on 2026-11-02, with every test passing so far.
        # Hit 14.1 minutes on PR #996 on 2026-11-04 on slow runners, with all 107 passing.
        timeout-minutes: 20
        # Its own output folder: a run empties its folder first, and the hermetic run's screenshots stay.
        run: npm run e2e:mobile -- --output=test-results/mobile
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Evidence never fails a shard: `e2e` below is the required check.
      - name: Keep screenshots for the evidence job
        if: always() && env.HARNESS_PR == 'true'
        continue-on-error: true
        run: mkdir -p evidence && find test-results -name '*.png' -exec cp --parents {} evidence/ \;

      - name: Upload screenshots for the evidence job
        if: always() && env.HARNESS_PR == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 3

  # WebKit and quarantined specs only inform, so they run beside the shards and
  # `e2e` does not wait for them. A cold apt cache on a slow mirror can take
  # 20+ min for webkit's ~120 MB, so that step gives up after 5 and the specs
  # still run (and may fail) without marking the run red.
  e2e-informational:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # One mobile-webkit run took 15.5 min (13 min of tests plus the build) on
    # 2026-11-11 (#1071), so it is split in two.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium and webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Cache Playwright OS packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: playwright-apt-webkit-${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-offline
          restore-keys: playwright-apt-webkit-${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-

      - name: Install Playwright OS dependencies
        timeout-minutes: 5
        continue-on-error: true
        run: .github/scripts/playwright-deps.sh chromium webkit

      # A shard ran 6 min of tests on 2026-11-11 (#1071); the cap leaves room for the build and slow runners.
      - name: Run mobile E2E (webkit, informational)
        timeout-minutes: 12
        continue-on-error: true
        run: npm run e2e:mobile:webkit -- --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Run quarantined E2E specs (informational)
        if: always() && matrix.shard == 1
        timeout-minutes: 2
        continue-on-error: true
        run: npm run e2e:quarantine
        env:
          CI: true

  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = success

  # Agents never run e2e locally (#1324), so for an agent-harness PR this job publishes the
  # screenshots its changed specs took on purpose: to the agent-evidence branch under <issue>/
  # (from the PR's "Closes #N") and as one PR comment with the gallery. Never a required check.
  e2e-evidence:
    needs: e2e-shard
    if: always() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'agent/') || contains(github.event.pull_request.labels.*.name, 'agent-harness'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/harness

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-evidence-*
          path: evidence

      - name: Publish screenshots
        run: node scripts/harness/evidence.mjs evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
