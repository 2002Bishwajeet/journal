name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image tag must match the installed @playwright/test, so read it from the
  # lockfile instead of pinning it here.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read the Playwright version
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  # The hermetic suite split three ways; `e2e` below is the required check.
  # It runs in the Playwright image, which ships the browsers and their OS
  # packages: `playwright install-deps` on the runner spent up to 13.5 min in apt
  # on a slow or unreachable Ubuntu mirror (#868). Step caps are about 1.5x the
  # measured p90 and sum to 27 min; the rest covers the image pull and the
  # uncapped steps that take a second each.
  e2e-shard:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 32
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@v4

      - name: Use Node.js 22
        timeout-minutes: 1
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        timeout-minutes: 2
        run: npm ci --include=optional

      - name: Run E2E (hermetic)
        timeout-minutes: 16
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Run mobile E2E (chromium)
        if: matrix.shard == 1
        timeout-minutes: 4
        run: npm run e2e:mobile
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # WebKit and quarantined specs only inform, so they run beside the shards and
  # `e2e` does not wait for them.
  e2e-informational:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run mobile E2E (webkit, informational)
        timeout-minutes: 4
        continue-on-error: true
        run: npm run e2e:mobile:webkit
        env:
          CI: true

      - name: Run quarantined E2E specs (informational)
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: npm run e2e:quarantine
        env:
          CI: true

  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = success
