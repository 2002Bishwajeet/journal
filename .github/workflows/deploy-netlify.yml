name: Build and Deploy (Netlify)

# Production only: called by manual-release.yml with the version it just tagged.
on:
  workflow_call:
    inputs:
      version:
        description: "Released version without the v; deploys tag v<version>"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: deploy-netlify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          CI: true

      - name: Install Netlify CLI
        run: npm install --global netlify-cli@17.36.1

      - name: Deploy to Netlify
        run: netlify deploy --dir=dist --prod --build false --message "GitHub Actions deploy v${{ inputs.version }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
