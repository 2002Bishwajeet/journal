name: Build and Deploy (Cloudflare Pages)

# A push to main deploys a preview (alias `preview`). Production (`main`, the
# project's production branch) is deployed only by manual-release.yml, which
# calls this workflow with the version it just tagged.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: "Released version without the v; deploys tag v<version> to production"
        required: true
        type: string

# Opt into Node.js 24 for JS actions (Node 20 on runners is deprecated June 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Separate groups so a pending production deploy is never replaced by a push.
    concurrency: deploy-cloudflare-${{ inputs.version && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release: the tagged commit, not the commit the release was dispatched from.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          CI: true

      # Pages 308s /index.html -> /, and a redirected response served to a
      # navigation is a hard network error — every share link dies with "This
      # site can't be reached". Guarded here because it only breaks on Pages.
      - name: Verify service worker precaches the canonical shell URL
        run: |
          grep -q '"url":"/"' dist/sw.js \
            || { echo "::error::sw.js must precache '/' — see manifestTransforms in vite.config.ts"; exit 1; }
          if grep -q '"url":"index.html"' dist/sw.js; then
            echo "::error::sw.js precaches index.html, which Cloudflare Pages 308s to /"
            exit 1
          fi

      # The legacy v0.3/v0.4 engine assets are excluded by exact hash, which
      # drifts when those deps are bumped. Nothing else catches it: the app
      # still works, the precache just silently gains ~30 MB.
      - name: Verify legacy PGlite engines stay out of the precache
        run: node scripts/check-precache.mjs

      # --branch is explicit: wrangler otherwise reads it from git, and the
      # detached tag checkout would land on a `head` preview alias.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.90.0"
          command: pages deploy dist --project-name=journal --branch=${{ inputs.version && 'main' || 'preview' }} --commit-dirty=true
