name: Desktop Release

# Builds the desktop app for a `v<version>` app release and attaches it to that
# GitHub release (#305): a signed, notarised and stapled universal .dmg for macOS,
# an NSIS installer and an .msi for Windows (unsigned for now), and an AppImage and
# a .deb for Linux. Windows and Linux are built twice: for x64, and natively for ARM64 on
# GitHub's ARM runners (#1484). Each build also uploads its signed updater bundle and merges
# its platform into the release's latest.json, the endpoint in tauri.conf.json (#1141).
#
# Asset names carry no version, so `releases/latest/download/<name>` always gets
# the newest build (the site's download page links those).
#
# manual-release.yml calls this after it creates the release as a draft, once the
# repo variable DESKTOP_RELEASES is 'true'. Published releases are immutable, so the
# assets go to the draft, and the last job publishes it after every build and the
# checksums succeed. If a build fails, the release stays a draft: run this by hand
# with the tag and publish on (or re-run the failed jobs) to finish it.
#
# The build includes the paid code from the private submodule native/, checked out
# with GH_TOKEN. With publish off it builds, signs and notarises the same way but only
# uploads the installers as workflow artifacts: no release, tag or latest.json change,
# and no draft is needed.
#
# Universal Links (#1342): journal.cloudx.run share links open the Mac app. tao's app
# delegate passes the web-browsing activity to the deep-link plugin like a journal:// link
# (useDeepLinks routes it); the app needs the Associated Domains entitlement
# (src-tauri/macos-release.entitlements), which a Developer ID app may only have with an
# embedded provisioning profile. scripts/asc-release.mjs profile --mac gets the MAC_APP_DIRECT
# profile for the APPLE_CERTIFICATE certificate through the API key (reusing an ACTIVE one), and
# src-tauri/tauri.macos-release.conf.json signs with the entitlements and embeds the profile as
# Contents/embedded.provisionprofile. Local builds don't use that config: no entitlement, no profile.
#
# `security` (from manual-release.yml, or by hand) adds `"security": true` to
# latest.json before the release is published. The desktop updater then installs
# the release even for a license key whose updates ended (#1316). The field isn't
# signed; it can only make the updater install a bundle whose signature it still checks.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'App release tag to build and attach to (e.g. v2.66.8)'
        required: true
      publish:
        description: 'Attach to the draft release, update latest.json and publish it (off: workflow artifacts only)'
        type: boolean
        default: false
      security:
        description: 'Security release: add "security": true to latest.json, so keys whose updates ended get it too'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish:
        type: boolean
        default: true
      security:
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.macos-release.conf.json
            secrets: APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY
          - os: windows-latest
            args: --bundles nsis,msi
          # 22.04: an AppImage runs on distributions with this glibc or newer.
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          # ARM64 (#1484). `arch` names the assets: tauri-action would call the ARM AppImage
          # aarch64 and the .deb arm64, so both get arm64.
          - os: windows-11-arm
            args: --bundles nsis,msi
            arch: arm64
          - os: ubuntu-22.04-arm
            args: --bundles appimage,deb
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in GH_TOKEN TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD ${{ matrix.secrets }}; do
            if [ -z "${!name}" ]; then echo "::error::Actions secret $name is not set (#299)"; missing=1; fi
          done
          exit $missing

      # Assets can only be added to a draft (immutable releases). The draft's id is
      # given to tauri-action, which can't look a draft up by its tag.
      - name: Find the draft release
        id: release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          id=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId,isDraft -q 'select(.isDraft) | .databaseId')
          if [ -z "$id" ]; then
            echo "::error::Release $TAG is published, and published releases are immutable: assets can only be added to a draft"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          submodules: true
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      # Without native/ the app builds with the premium stubs: no license or paywall.
      - name: native/ is present
        shell: bash
        run: |
          if [ ! -f native/web/index.ts ] || [ ! -f native/rust/mod.rs ]; then
            echo "::error::native/ (journal-native-features) is not checked out: GH_TOKEN needs read access to it"
            exit 1
          fi
          echo "native/ at $(git -C native rev-parse --short HEAD)"
          # Without the billing Worker's origin the app has no trial or paywall: never publish that.
          if [ -z "$BILLING_URL" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::Repo variable DESKTOP_BILLING_URL is not set: a release would ship the desktop app unlocked"
              exit 1
            fi
            echo "::warning::Repo variable DESKTOP_BILLING_URL is not set: this build has no trial, paywall or license activation"
          fi
        env:
          BILLING_URL: ${{ vars.DESKTOP_BILLING_URL }}
          PUBLISH: ${{ inputs.publish }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # @homebase-id/js-lib is public, which the job token can read; the fine-grained
      # GH_TOKEN can't read GitHub Packages (403 without a warm npm cache).
      - name: Authenticate to Github packages
        shell: bash
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install WebKitGTK and GTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      # notarytool takes the App Store Connect API key as a .p8 file.
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # The certificate comes out of a keychain of this step's own; the build's keychain is the Tauri CLI's.
      - name: Developer ID provisioning profile
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD"
          rm "$RUNNER_TEMP/developer-id.p12"
          if ! security find-certificate -c 'Developer ID Application' -p "$keychain" > "$RUNNER_TEMP/developer-id.pem"; then
            echo "::error::APPLE_CERTIFICATE has no Developer ID Application certificate"
            exit 1
          fi
          security delete-keychain "$keychain"
          mkdir -p src-tauri/target
          node scripts/asc-release.mjs profile --mac --certificate "$RUNNER_TEMP/developer-id.pem" \
            --out src-tauri/target/embedded.provisionprofile

      # The Tauri CLI imports APPLE_CERTIFICATE into a temporary keychain, signs
      # with the hardened runtime, notarises with the API key and staples.
      # tauri.release.conf.json turns on the updater bundles, signed with
      # TAURI_SIGNING_PRIVATE_KEY.
      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Bishwajeet Parhi (N899Y9TW48)'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # The billing Worker's origin turns on the trial, paywall and license keys
          # (native/AGENTS.md): VITE_ for the web, JOURNAL_ compiled into the Rust side.
          VITE_BILLING_URL: ${{ vars.DESKTOP_BILLING_URL }}
          JOURNAL_BILLING_URL: ${{ vars.DESKTOP_BILLING_URL }}
          # The release port (PROD_PORT in src-tauri/src/lib.rs, #1308): set only in the
          # release and store workflows, so a local or dev build never blocks the installed app.
          JOURNAL_RELEASE_BUILD: '1'
        with:
          # No release id (publish off): tauri-action builds and uploads nothing.
          releaseId: ${{ steps.release.outputs.id }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          # Journal-darwin-universal.dmg, Journal-windows-x64-setup.exe, Journal-windows-x64.msi,
          # Journal-linux-amd64.AppImage, Journal-linux-amd64.deb, and the ARM builds' -arm64 ones
          # (+ updater bundles and .sig files).
          releaseAssetNamePattern: "Journal-[platform]-${{ matrix.arch || '[arch]' }}[setup][ext]"
          updaterJsonPreferNsis: true
          retryAttempts: 1

      # #1342: without Associated Domains (or the profile that allows it) share links open the browser.
      - name: Check the Mac app's entitlements
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Journal.app
          if [ ! -f "$app/Contents/embedded.provisionprofile" ]; then
            echo "::error::$app has no Contents/embedded.provisionprofile"
            exit 1
          fi
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          node scripts/ios-entitlements.mjs --macos "$RUNNER_TEMP/entitlements.plist"

      # Tauri notarises and staples the .app, not the dmg around it, so Gatekeeper
      # rejects the download ("Unnotarized Developer ID"). The build step has already
      # uploaded the dmg when publishing, so replace that copy.
      - name: Notarise and staple the dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          if [ "${{ inputs.publish }}" = true ]; then
            cp "$dmg" "$RUNNER_TEMP/Journal-darwin-universal.dmg"
            gh release upload "${{ inputs.tag }}" "$RUNNER_TEMP/Journal-darwin-universal.dmg" -R "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Upload installers
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/**/release/bundle/*/*.dmg
            src-tauri/target/**/release/bundle/*/*.exe
            src-tauri/target/**/release/bundle/*/*.msi
            src-tauri/target/**/release/bundle/*/*.AppImage
            src-tauri/target/**/release/bundle/*/*.deb
            src-tauri/target/**/release/bundle/*/*.tar.gz
            src-tauri/target/**/release/bundle/*/*.sig
          if-no-files-found: error

  # Runs once every build has uploaded: SHA-256 checksums for the download page,
  # and a check that no platform's latest.json entry was lost (the builds merge
  # the file one at a time, and two finishing together could drop one).
  checksums:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check latest.json
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -D "$RUNNER_TEMP"
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64; do
            jq -e --arg p "$platform" '.platforms[$p].url' "$RUNNER_TEMP/latest.json" > /dev/null \
              || { echo "::error::latest.json has no $platform entry: re-run this workflow for $TAG"; exit 1; }
          done

      # After every build merged its platform: the release is still a draft, so the file can be replaced.
      - name: Mark latest.json as a security release
        if: inputs.security
        run: |
          mkdir "$RUNNER_TEMP/security"
          jq '.security = true' "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/security/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/security/latest.json" -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload SHA256SUMS.txt
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'Journal-*'
          sha256sum Journal-* > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber

  # Last: the release is immutable once published, so every asset must be on it first.
  publish:
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
