name: E2E Live (hosted fallback)

# Layer 3, hosted-identity fallback (#204). Dormant until the
# E2E_LIVE_STORAGE_STATE secret is added (only needed if the Docker spike
# #240 ends NO-GO) — until then this just prints a notice and exits 0.
# Not a PR check: local live runs (npm run e2e:live) are the primary way to
# exercise this tier; see e2e/README.md.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for E2E_LIVE_STORAGE_STATE secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.E2E_LIVE_STORAGE_STATE }}" ]; then
            echo "::notice::E2E_LIVE_STORAGE_STATE secret is not set — skipping the live e2e run. See issue #204."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 22
        if: steps.check-secret.outputs.has_secret == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Github packages
        if: steps.check-secret.outputs.has_secret == 'true'
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        if: steps.check-secret.outputs.has_secret == 'true'
        run: npm ci --include=optional

      - name: Install Playwright browsers
        if: steps.check-secret.outputs.has_secret == 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore live storage state
        if: steps.check-secret.outputs.has_secret == 'true'
        run: |
          mkdir -p e2e/.auth
          echo "${{ secrets.E2E_LIVE_STORAGE_STATE }}" | base64 -d > e2e/.auth/live.json

      - name: Run live e2e suite
        if: steps.check-secret.outputs.has_secret == 'true'
        run: npm run e2e:live
        env:
          CI: true
          E2E_LIVE_IDENTITY: ${{ vars.E2E_LIVE_IDENTITY }}

      - name: Upload Playwright report
        if: steps.check-secret.outputs.has_secret == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
