name: Tauri

# Compiles and tests the native shell (src-tauri) on Linux. Signing and release
# builds are #305. lib.rs embeds public/_headers, so that file runs this too.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'public/_headers'
      - '.github/workflows/tauri.yml'

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The private native/ submodule is never checked out here, so this job
      # proves the shell builds without the premium code.
      - name: native/ is absent
        run: test -z "$(ls -A ../native)"

      - name: Install WebKitGTK and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --features custom-protocol embeds frontendDist (../dist). A stub page is
      # enough to compile; the real frontend is built by the other workflows.
      - name: Stub dist
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: cargo check
        run: cargo check --locked --features custom-protocol

      - name: cargo test
        run: cargo test --locked
