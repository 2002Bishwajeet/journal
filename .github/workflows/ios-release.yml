name: iOS Release

# Builds Journal+ for iPhone and iPad on a macOS runner and sends it to App Store
# Connect (#1304). The owner's Mac is only for Simulator and Appium proofs now.
#
#   mode internal: every push to main (and a manual run). The build goes to TestFlight
#                  for the internal testers. A newer push cancels an older main build.
#   mode submit:   manual-release.yml calls this after it pushes the tag. The build goes
#                  up, then scripts/asc-release.mjs creates or reuses the App Store version
#                  for the tag, sets its What's New from RELEASE_NOTES.md, attaches the
#                  build and submits it to App Review. A version still waiting for review
#                  or in review is cancelled first (latest wins; the log names it).
#                  In-app purchases (and subscription groups) App Review has not approved
#                  ride along in the same submission until they are approved (#1330).
#                  Nothing cancels a release build.
# The release commit itself has [skip ci], so it gets only the submit build.
#
# Build number (CFBundleVersion): the commit count, or one above the highest uploaded
# build when that is higher. Version: the tag's on a release. On main, package.json's,
# or the next patch after the last version the App Store released when that is higher
# (Apple closes a version's build train once it is released).
#
# dry_run builds the app without signing it (tauri ios build --no-sign) and stops:
# no App Store Connect call, no upload. It needs only GH_TOKEN, and runs even while
# STORE_BUILDS is off.
#
# Store builds set JOURNAL_BILLING_URL and never VITE_BILLING_URL (native/AGENTS.md):
# the store sells the unlock there, not the website.
#
# Off until the secrets below are set: `gh variable set STORE_BUILDS --body true`
# (android-release.yml reads the same variable).
#
# Secrets (Settings → Secrets and variables → Actions). Never print them.
#   GH_TOKEN               Fine-grained token with Contents: read on the private repo
#                          2002Bishwajeet/journal-native-features (desktop-release.yml uses it too).
#   APPLE_API_KEY          Key ID of an App Store Connect API key. Make the key in App Store Connect →
#                          Users and Access → Integrations → App Store Connect API → Team Keys, with the
#                          App Manager role (enough for the profile below; no cloud signing is needed).
#   APPLE_API_ISSUER       The Issuer ID shown above the keys on that page.
#   APPLE_API_PRIVATE_KEY  The contents of the AuthKey_<key id>.p8 file, which App Store Connect lets you
#                          download once, when you make the key.
#   IOS_DISTRIBUTION_P12           The team's Apple Distribution certificate with its private key, exported
#                                  from Keychain Access as a .p12, base64: `base64 -i dist.p12 | pbcopy`.
#   IOS_DISTRIBUTION_P12_PASSWORD  The password the .p12 was exported with.
# desktop-release.yml uses the same three APPLE_API_* secrets to notarise.
#
# Signing (#1336) is by hand, not cloud-managed: an App Manager key can't use the cloud-managed
# distribution certificate. The job imports the .p12 into a keychain of its own (deleted at the end),
# then scripts/asc-release.mjs profile installs the App Store profile for that certificate through the
# API key: it reuses an ACTIVE one, or replaces the INVALID ones with "Journal CI App Store". The archive
# and export then sign with the certificate and that profile (scripts/ios-project.mjs).
#
# Universal Links (#1326): the app's entitlements have Associated Domains (applinks:journal.cloudx.run),
# and the profile takes its capabilities from the App ID. If a signed build fails its entitlements check,
# turn the capability on for the App ID (Certificates, Identifiers & Profiles → Identifiers →
# com.biswa.journal → Associated Domains): that invalidates the profile, and the next run replaces it.
on:
  push:
    branches: [main]
    # Skip pushes that can't change the app.
    paths:
      - '**'
      - '!docs/**'
      - '!release-notes/**'
      - '!site/**'
      - '!*.md'
      - '!.github/**'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'internal: TestFlight only. submit: also submit the tag to App Review'
        type: choice
        options: [internal, submit]
        default: internal
      tag:
        description: 'Release tag to build (e.g. v2.72.0), needed for submit. Empty: the selected branch'
        default: ''
      dry_run:
        description: 'Build without signing and stop: no App Store Connect call, no upload'
        type: boolean
        default: false
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      tag:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false

jobs:
  ios:
    if: inputs.dry_run || vars.STORE_BUILDS == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ios-release-${{ inputs.dry_run && 'dry-' || '' }}${{ inputs.mode == 'submit' && inputs.tag || 'main' }}
      cancel-in-progress: ${{ inputs.mode != 'submit' }}
    env:
      MODE: ${{ inputs.mode || 'internal' }}
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # License keys (#301): the Rust side compiles the billing Worker's origin in.
      JOURNAL_BILLING_URL: https://journal-billing.cloudx.run
      # The release port (PROD_PORT in src-tauri/src/lib.rs, #1308).
      JOURNAL_RELEASE_BUILD: '1'
    steps:
      - name: Check inputs and secrets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          missing=0
          if [ "$MODE" = submit ] && [ -z "$TAG" ]; then echo "::error::mode submit needs a tag"; missing=1; fi
          names=GH_TOKEN
          if [ "$DRY_RUN" != true ]; then
            names="$names APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_P12_PASSWORD"
          fi
          for name in $names; do
            if [ -z "${!name}" ]; then echo "::error::Actions secret $name is not set (see this workflow's header)"; missing=1; fi
          done
          exit $missing

      # Full history: the build number is at least the commit count.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      # Without native/ the app builds with the premium stubs: no store purchase.
      - name: native/ is present
        run: |
          if [ ! -f native/web/index.ts ] || [ ! -f native/rust/mod.rs ]; then
            echo "::error::native/ (journal-native-features) is not checked out: GH_TOKEN needs read access to it"
            exit 1
          fi
          echo "native/ at $(git -C native rev-parse --short HEAD)"

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # @homebase-id/js-lib is public, which the job token can read; the fine-grained
      # GH_TOKEN can't read GitHub Packages.
      - name: Authenticate to Github packages
        run: |
          echo "@homebase-id:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      # native/scripts/apple-targets.rb (npm run native:ios:targets) needs the xcodeproj gem,
      # and scripts/ios-project.mjs runs XcodeGen.
      - name: Use Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install XcodeGen and xcodeproj
        run: |
          brew install xcodegen
          gem install xcodeproj

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri ios build (the export's upload) and scripts/asc-release.mjs read the key as a .p8 file.
      - name: Write the App Store Connect API key
        if: env.DRY_RUN != 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # The Apple Distribution certificate and its key, in a keychain codesign may use without a
      # prompt. Its PEM is what the profile step matches on App Store Connect.
      - name: Import the distribution certificate
        if: env.DRY_RUN != 'true'
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$password" "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -f pkcs12 -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          if ! security find-certificate -c 'Apple Distribution' -p "$keychain" > "$RUNNER_TEMP/distribution.pem"; then
            echo "::error::IOS_DISTRIBUTION_P12 has no Apple Distribution certificate"
            exit 1
          fi

      - name: App Store provisioning profile
        id: profile
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: node scripts/asc-release.mjs profile --certificate "$RUNNER_TEMP/distribution.pem" | tee -a "$GITHUB_OUTPUT"

      - name: Build number and version
        id: versions
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # pipefail: a failed asc-release.mjs (auth, tag not above the released version) fails the step.
        shell: bash
        run: |
          args=(--commit-count "$(git rev-list --count HEAD)" --package-version "$(node -p "require('./package.json').version")")
          if [ "$MODE" = submit ]; then args+=(--tag "$TAG"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--offline); fi
          node scripts/asc-release.mjs versions "${args[@]}" | tee -a "$GITHUB_OUTPUT"

      # The App Store limit for What's New is 4000 characters.
      - name: What's New
        if: env.MODE == 'submit'
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          node scripts/release-notes.mjs --store "$VERSION" 4000 > "$RUNNER_TEMP/whats-new.txt"
          { echo "### What's New ($VERSION)"; echo '```'; cat "$RUNNER_TEMP/whats-new.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build without signing (dry run)
        if: env.DRY_RUN == 'true'
        env:
          JOURNAL_IOS_BUILD_NUMBER: ${{ steps.versions.outputs.build_number }}
          JOURNAL_IOS_VERSION: ${{ steps.versions.outputs.version }}
        run: npm run tauri:ios:release -- --no-sign

      # JOURNAL_IOS_PROFILE makes scripts/ios-project.mjs sign by hand with the certificate and
      # profile above. With APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_PATH set, tauri ios
      # build passes the key to xcodebuild (its -allowProvisioningUpdates is harmless with manual
      # signing); the export's destination=upload sends the build to App Store Connect.
      - name: Build, sign and upload to TestFlight
        if: env.DRY_RUN != 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          JOURNAL_IOS_PROFILE: ${{ steps.profile.outputs.profile_uuid }}
          JOURNAL_IOS_BUILD_NUMBER: ${{ steps.versions.outputs.build_number }}
          JOURNAL_IOS_VERSION: ${{ steps.versions.outputs.version }}
        run: npm run tauri:ios:release

      # #1326: a build without Associated Domains does not open journal.cloudx.run links.
      # The unsigned dry run has no signature to read: check the project's entitlements file.
      - name: Check the app's entitlements
        run: |
          if [ "$DRY_RUN" = true ]; then
            node scripts/ios-entitlements.mjs src-tauri/gen/apple/journal_iOS/journal_iOS.entitlements
            exit
          fi
          app=$(find src-tauri/gen/apple/build -path '*.xcarchive/Products/Applications/*.app' -prune | head -1)
          if [ -z "$app" ]; then echo "::error::No archived .app under src-tauri/gen/apple/build"; exit 1; fi
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          node scripts/ios-entitlements.mjs "$RUNNER_TEMP/entitlements.plist"

      - name: Submit to App Review
        if: env.MODE == 'submit' && env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.versions.outputs.version }}
          BUILD: ${{ steps.versions.outputs.build_number }}
        run: node scripts/asc-release.mjs submit --version "$VERSION" --build "$BUILD" --notes-file "$RUNNER_TEMP/whats-new.txt"

      - name: Summary
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          BUILD: ${{ steps.versions.outputs.build_number }}
        run: |
          if [ "$DRY_RUN" = true ]; then result='built without signing (dry run): nothing uploaded'
          elif [ "$MODE" = submit ]; then result='uploaded and submitted to App Review'
          else result='uploaded to TestFlight'; fi
          echo "iOS $VERSION ($BUILD): $result" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"
