# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      tiptap: { patterns: ["@tiptap/*"] }
      radix: { patterns: ["@radix-ui/*", "radix-ui"] }
      tanstack: { patterns: ["@tanstack/*"] }
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
      dev-tooling: { patterns: ["eslint*", "typescript*", "vitest", "@vitest/*", "vite", "@vitejs/*"] }
    ignore:
      # typescript-eslint's peer range stops below TS 7; TS 7 comes in through the
      # typescript-7 alias instead. Drop this once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7"]
