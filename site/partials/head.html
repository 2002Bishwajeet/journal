<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDFCF8" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1B1A" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Journal" />
<meta property="og:image" content="/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Journal. Your notes on your device, private by design." />
<meta name="twitter:card" content="summary_large_image" />
<script>
  // Theme before first paint: the visitor's choice, else the system setting.
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    var t = null;
    try { t = localStorage.getItem('journal-site-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.setAttribute('data-theme', t);
  })();
</script>
<script type="module" src="/src/main.ts"></script>
