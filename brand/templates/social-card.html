<!doctype html>
<!-- 1200x630 social card. Params: ?title=&kicker=&theme=dark -->
<html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=block" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;box-sizing:border-box;padding:72px 84px;display:flex;flex-direction:column;justify-content:space-between;
    background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
  body.dark{background:var(--night);color:var(--mist)}
  header{display:flex;align-items:center;gap:14px}
  header img{height:44px}
  .kicker{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-bottom:22px}
  h1{font-family:var(--font-serif);font-weight:500;font-size:76px;line-height:1.05;margin:0;max-width:960px;letter-spacing:-.01em}
  footer{display:flex;justify-content:space-between;font-size:22px;color:var(--stone);border-top:1px solid var(--line);padding-top:22px}
  body.dark footer{border-color:var(--night-line)}
</style></head>
<body>
  <header><img id="logo" src="../logo/wordmark-light.svg" alt="Journal"></header>
  <main><div class="kicker" id="kicker">Local-first notebook</div><h1 id="title">Your notes on your device, private by design.</h1></main>
  <footer><span>Local-first · encrypted sync · agent-ready</span><span>Your own private space</span></footer>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('title')) title.textContent = q.get('title');
  if (q.get('kicker')) kicker.textContent = q.get('kicker');
  if (q.get('theme') === 'dark') { document.body.className = 'dark'; logo.src = '../logo/wordmark-dark.svg'; }
</script></body></html>
